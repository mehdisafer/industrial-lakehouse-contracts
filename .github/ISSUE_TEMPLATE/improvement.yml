name: Engineering improvement
description: Propose an outcome, scope and measurable acceptance criteria.
title: "[Improvement] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and operational value
      description: Describe the user or engineering need before proposing a technology.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope and trade-offs
      description: Affected contracts, profiles, interfaces, dependencies and exclusions.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria and evidence
      description: Distinguish unit checks, actual integrations and performance measurements.
    validations:
      required: true
  - type: textarea
    id: operations
    attributes:
      label: Operational constraints
      description: Permissions, data classification, cost, reversibility and deployment requirements.
    validations:
      required: true
