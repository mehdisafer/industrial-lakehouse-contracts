name: Native-profile qualification (manual, unverified)
on:
  workflow_dispatch:
    inputs:
      disposable_synthetic_only:
        description: Confirm this hosted disposable job contains no client data or production access
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  native:
    if: inputs.disposable_synthetic_only
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ilc_demo
          POSTGRES_USER: ilc_demo
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ilc_demo -d ilc_demo"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      ILC_ALLOW_NATIVE_DEMO: '1'
      ILC_NATIVE_TESTS: '1'
      ILC_SOURCE_DSN: postgresql://ilc_demo:ephemeral-ci-only@127.0.0.1:5432/ilc_demo
      ILC_STATE_DSN: postgresql+psycopg://ilc_demo:ephemeral-ci-only@127.0.0.1:5432/ilc_demo
      SPARK_LOCAL_IP: 127.0.0.1
      TZ: UTC
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require runner Java 17 explicitly
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          "$JAVA_HOME_17_X64/bin/java" -version
      - run: python -m pip install -e '.[native,test]'
      - run: python -m pytest -m native --basetemp=.runtime/native-tests --junitxml=artifacts/native-junit.xml
      - name: Qualify native recovery and report consumer
        run: python scripts/qualify_native.py --output .runtime/native-qualification --rows 10000
      - name: Retain native artifacts only on this synthetic job
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-qualification
          path: |
            artifacts/native-junit.xml
            .runtime/native-qualification/evidence/
            .runtime/native-tests/**/acceptance.json
            .runtime/native-tests/**/manifest.json
          if-no-files-found: error
          retention-days: 14
