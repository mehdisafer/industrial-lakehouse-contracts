# Optional manual alternative. CircleCI is the active automatic CI route.
name: Reference-profile qualification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reference-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reference:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ['3.12', '3.13']
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]'
      - run: python -m compileall -q src tests scripts fabric
      - run: python -m ilc.cli validate
      - run: python -m pytest --junitxml=artifacts/junit.xml
      - run: python scripts/qualify_reference.py --output .runtime/ci-reference --rows 10000
      - run: python scripts/qualify_recovery_governance.py --output .runtime/ci-recovery --rows 10000
      - name: Preserve actual results, not runtime credentials or source databases
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reference-${{ matrix.os }}-${{ matrix.python }}
          path: |
            artifacts/junit.xml
            .runtime/ci-reference/evidence/
            .runtime/ci-recovery/evidence/
          if-no-files-found: error
          retention-days: 14
