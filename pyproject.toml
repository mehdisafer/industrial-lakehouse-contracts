[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-lakehouse-contracts"
version = "0.1.0"
description = "Contract-driven industrial data pipeline with immutable acceptance and explicit qualification profiles"
requires-python = ">=3.12,<3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["SQLAlchemy==2.0.50", "httpx==0.28.1", "fastapi==0.128.2", "uvicorn==0.48.0"]

[project.optional-dependencies]
test = ["pytest==9.0.2"]
native = ["psycopg[binary]==3.2.13", "pyspark==4.0.1", "delta-spark==4.0.1", "dagster==1.11.16"]

[project.scripts]
ilc = "ilc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
markers = ["native: requires real PostgreSQL, Spark/Delta and Dagster; not a reference-profile result"]
